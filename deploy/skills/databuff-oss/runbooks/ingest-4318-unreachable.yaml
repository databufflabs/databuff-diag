id: ingest-4318-unreachable
skill: databuff-oss
symptoms:
  - cannot reach ingest on port 4318
  - OTLP HTTP exporter connection refused
  - ingest health check failed
  - no traces received at http://host:4318/v1/traces
checks:
  - id: compose_ps_ingest
    cmd: "docker compose -f /opt/databuff-ai-apm/docker-compose.yml ps ai-apm-ingest 2>&1"
    risk: readonly
  - id: ingest_health
    cmd: "curl -sf http://127.0.0.1:4318/health 2>&1 || curl -v http://127.0.0.1:4318/health 2>&1 | tail -20"
    risk: readonly
  - id: ingest_port_listen
    cmd: "ss -tlnp 2>/dev/null | grep ':4318' || netstat -tlnp 2>/dev/null | grep ':4318' || echo '4318 not listening on host'"
    risk: readonly
  - id: ingest_logs
    cmd: "docker compose -f /opt/databuff-ai-apm/docker-compose.yml logs ai-apm-ingest --tail 80 2>&1"
    risk: readonly
  - id: doris_dependency
    cmd: "docker compose -f /opt/databuff-ai-apm/docker-compose.yml ps ai-apm-doris-fe ai-apm-doris-be 2>&1"
    risk: readonly
hints:
  - Ingest starts only after Doris FE and BE are healthy; check Doris runbooks if ingest is Created/Starting.
  - Health probe is http://127.0.0.1:4318/health; OTLP HTTP traces use /v1/traces on the same port.
  - gRPC OTLP uses port 4317 — verify exporter protocol matches the configured port.
  - Connection refused on host IP but health OK on 127.0.0.1 may indicate firewall or binding issue — use curl output to distinguish.
