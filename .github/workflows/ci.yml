name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: make build VERSION=ci

      - name: Binary size gate (<30MB)
        run: make size VERSION=ci

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w" -o "databuff-diag-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/databuff-diag
          ls -lh "databuff-diag-${{ matrix.goos }}-${{ matrix.goarch }}"
          bytes=$(stat -c%s "databuff-diag-${{ matrix.goos }}-${{ matrix.goarch }}")
          test "$bytes" -lt 31457280
          if [ "${{ matrix.goos }}" = linux ]; then
            file "databuff-diag-${{ matrix.goos }}-${{ matrix.goarch }}" | grep -q 'statically linked'
          fi

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List snapshot artifacts
        run: ls -lh dist/

      - name: Verify Linux release binaries are statically linked
        run: |
          for bin in dist/databuff-diag_linux_amd64_v1/databuff-diag \
                     dist/databuff-diag_linux_arm64_v8.0/databuff-diag; do
            echo "checking $bin"
            file "$bin" | grep -q 'statically linked'
            if strings "$bin" | grep -qE '^GLIBC_2\.(3[2-9]|[4-9][0-9])'; then
              echo "unexpected glibc version dependency in $bin" >&2
              strings "$bin" | grep '^GLIBC_' | sort -Vu
              exit 1
            fi
          done
