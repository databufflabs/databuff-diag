name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Skip if release already published
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length')
            if [ "$ASSETS" -gt 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already has $ASSETS assets; skipping GoReleaser."
            fi
          fi

      - name: Run GoReleaser
        if: steps.release.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
